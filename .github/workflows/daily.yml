name: Daily jewellery ad harvest

on:
  schedule:
    - cron: "17 6 * * *"   # every morning at 06:17 UTC (6:17am UK winter, 7:17am summer). Picks up ads that started yesterday.
  workflow_dispatch:        # adds a "Run workflow" button for testing

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Harvest and send to n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
          COUNTRIES: ${{ vars.COUNTRIES }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
        run: node harvest.js

      - name: Save debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            page.png
            diag.txt
            debug.png
            debug.html
          if-no-files-found: ignore
