name: Spot check brands (temporary, sends nothing)
on:
  workflow_dispatch:
    inputs:
      domains:
        description: space separated domains
        required: true
jobs:
  spot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node spot/check.js ${{ inputs.domains }}
