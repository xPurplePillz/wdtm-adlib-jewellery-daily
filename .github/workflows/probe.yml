name: Probe (temporary test, sends nothing)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Probe
        run: node probe.js
